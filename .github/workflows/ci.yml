name: CI

# Runs on every pull request targeting main and on pushes to main, so the same
# gate protects the merge button and keeps main green afterwards.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the previous run instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # package.json requires >= 22.12.0; "22" resolves to the latest 22.x.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Basic format check
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
